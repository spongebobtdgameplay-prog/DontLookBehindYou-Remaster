<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Dev Auth</title>
</head>
<body>
<script>
(function(){
  const Params=new URLSearchParams(location.search);
  const RequestId=Params.get("requestId")||"";
  const Success=Params.get("success")==="1";
  const Message={
    type:"DLBY_DEV_PIN_RESULT",
    requestId:RequestId,
    success:Success
  };

  if(window.opener&&!window.opener.closed){
    window.opener.postMessage(Message,"https://spongebobtdgameplay-prog.github.io");
    setTimeout(()=>window.close(),40);
    return;
  }

  if(window.parent&&window.parent!==window){
    window.parent.postMessage(Message,"https://spongebobtdgameplay-prog.github.io");
  }
})();
</script>
</body>
</html>
