<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Dev Auth</title>
<style>
html,body{margin:0;min-height:100%;background:#080908;color:#d9e8c9;font-family:monospace;}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px;box-sizing:border-box;}
</style>
</head>
<body>
<div id="status">RETURNING TO GAME...</div>
<script>
(function(){
  const Params=new URLSearchParams(location.search);
  const RequestId=Params.get("requestId")||"";
  const Success=Params.get("success")==="1";
  const Status=document.getElementById("status");

  if(!/^[A-Za-z0-9._-]{1,100}$/.test(RequestId)){
    Status.textContent="INVALID AUTH RESPONSE. YOU MAY CLOSE THIS WINDOW.";
    return;
  }

  try{
    localStorage.setItem(
      "dlby_dev_auth_result_"+RequestId,
      Success?"1":"0"
    );
    Status.textContent=Success?"ACCESS GRANTED. RETURNING...":"ACCESS DENIED. RETURNING...";
  }catch(Error){
    Status.textContent="COULD NOT RETURN AUTH RESULT. YOU MAY CLOSE THIS WINDOW.";
    return;
  }

  setTimeout(()=>{
    try{ window.close(); }catch(Error){}
  },120);
})();
</script>
</body>
</html>
